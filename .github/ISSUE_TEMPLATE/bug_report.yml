name: Bug report
description: Report incorrect enumeration, classification, or behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows build and architecture
      placeholder: Windows 11 25H2 build 26200, x64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Redact usernames and private paths where needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include private keys, tokens, or sensitive file paths.
          required: true
