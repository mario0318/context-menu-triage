name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:windows

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:exe -- --SkipSign
      - name: Verify executable metadata
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $info = (Get-Item .\dist\context-menu-triage.exe).VersionInfo
          if ($info.ProductName -ne 'Context Menu Triage') { throw "Unexpected ProductName: $($info.ProductName)" }
          if (-not $info.ProductVersion.StartsWith("$version.")) { throw "Unexpected ProductVersion: $($info.ProductVersion)" }
          if ($info.OriginalFilename -ne 'context-menu-triage.exe') { throw "Unexpected OriginalFilename: $($info.OriginalFilename)" }
      - run: .\dist\context-menu-triage.exe audit --scope broad --quiet
      - uses: actions/upload-artifact@v6
        with:
          name: context-menu-triage-windows-x64
          path: |
            dist/context-menu-triage.exe
            dist/context-menu-triage.exe.sha256
            dist/sbom.cdx.json
