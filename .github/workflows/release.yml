name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Validate version matches tag
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $tag) { throw "package.json version $pkg does not match tag $tag" }
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($conf -ne $tag) { throw "tauri.conf.json version $conf does not match tag $tag" }
      - name: Build native app and installer
        shell: powershell
        run: npm run app:build
      - name: Collect release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          $app = "src-tauri/target/release/context-menu-triage-app.exe"
          $info = (Get-Item $app).VersionInfo
          if ($info.ProductName -ne 'Context Menu Triage') { throw "Unexpected ProductName: $($info.ProductName)" }
          Copy-Item $setup.FullName "release-assets/context-menu-triage-setup.exe"
          Copy-Item "dist/sbom.cdx.json" "release-assets/sbom.cdx.json"
          Get-ChildItem release-assets -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem release-assets | Select-Object Name,Length | Format-Table -Auto
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $title = "Context Menu Triage $env:GITHUB_REF_NAME (unsigned interim)"
          $notes = "docs/release-notes-$version.md"
          $args = @('release', 'create', $env:GITHUB_REF_NAME,
            'release-assets/context-menu-triage-setup.exe',
            'release-assets/context-menu-triage-setup.exe.sha256',
            'release-assets/sbom.cdx.json',
            '--verify-tag', '--title', $title)
          if (Test-Path -LiteralPath $notes) { $args += @('--notes-file', $notes) } else { $args += '--generate-notes' }
          & gh @args
          if ($LASTEXITCODE) { throw 'GitHub Release creation failed.' }
