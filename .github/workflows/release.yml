name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Validate version matches tag
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $tag) { throw "package.json version $pkg does not match tag $tag" }
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($conf -ne $tag) { throw "tauri.conf.json version $conf does not match tag $tag" }
      - name: Build native app and installer
        shell: powershell
        run: npm run app:build
      - name: Stage installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          $app = "src-tauri/target/release/context-menu-triage-app.exe"
          $info = (Get-Item $app).VersionInfo
          if ($info.ProductName -ne 'Context Menu Triage') { throw "Unexpected ProductName: $($info.ProductName)" }
          Copy-Item $setup.FullName "release-assets/context-menu-triage-setup.exe"
          Copy-Item "dist/sbom.cdx.json" "release-assets/sbom.cdx.json"
      - name: Determine signing mode
        id: mode
        shell: powershell
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            Write-Warning 'SignPath is not configured; publishing an UNSIGNED interim release.'
            "signing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "signing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Upload unsigned installer
        id: upload-unsigned
        if: steps.mode.outputs.signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: context-menu-triage-installer-unsigned
          path: release-assets/context-menu-triage-setup.exe
          if-no-files-found: error
      - name: Submit SignPath signing request
        if: steps.mode.outputs.signing == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}\signed
      - name: Verify signed installer
        if: steps.mode.outputs.signing == 'true'
        shell: powershell
        run: |
          $signed = Get-ChildItem .\signed -Filter *setup*.exe -File -Recurse | Select-Object -First 1
          if (-not $signed) { throw "Signed installer not returned by SignPath" }
          Copy-Item -LiteralPath $signed.FullName -Destination "release-assets/context-menu-triage-setup.exe" -Force
          $signature = Get-AuthenticodeSignature "release-assets/context-menu-triage-setup.exe"
          if ($signature.Status -ne 'Valid') { throw "Stable releases require a valid Authenticode signature. Status: $($signature.Status)" }
          Write-Output "Signed installer Authenticode: $($signature.Status)"
      - name: Checksums
        shell: powershell
        run: |
          Get-ChildItem release-assets -File | Where-Object { $_.Extension -ne '.sha256' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem release-assets | Select-Object Name,Length | Format-Table -Auto
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ steps.mode.outputs.signing }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $signed = $env:SIGNING -eq 'true'
          $title = if ($signed) { "Context Menu Triage $env:GITHUB_REF_NAME" } else { "Context Menu Triage $env:GITHUB_REF_NAME (unsigned interim)" }
          $notes = "docs/release-notes-$version.md"
          $args = @('release', 'create', $env:GITHUB_REF_NAME,
            'release-assets/context-menu-triage-setup.exe',
            'release-assets/context-menu-triage-setup.exe.sha256',
            'release-assets/sbom.cdx.json',
            '--verify-tag', '--title', $title)
          if (Test-Path -LiteralPath $notes) { $args += @('--notes-file', $notes) } else { $args += '--generate-notes' }
          & gh @args
          if ($LASTEXITCODE) { throw 'GitHub Release creation failed.' }
