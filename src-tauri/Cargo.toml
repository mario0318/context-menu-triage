[package]
name = "context-menu-triage-app"
version = "1.3.0"
description = "Context Menu Triage desktop shell"
authors = ["mario0318"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "context_menu_triage_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
