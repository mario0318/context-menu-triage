<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Context Menu Triage</title>
<style>
  :root { color-scheme: light dark; }
  html,body { height:100%; margin:0; }
  body {
    display:grid; place-items:center;
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    color:#5a686e; background:#e9edef;
  }
  @media (prefers-color-scheme: dark) { body { color:#9fabad; background:#0e1213; } }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .logo {
    width:52px; height:52px; border-radius:14px; display:grid; place-items:center;
    background:linear-gradient(160deg,#3b74f5,#1b4fd0);
    box-shadow:0 6px 18px rgba(37,99,235,.4);
  }
  .logo svg { width:28px; height:28px; color:#fff; }
  .name { font-family:Bahnschrift,"Segoe UI",sans-serif; font-size:16px; letter-spacing:.3px; color:inherit; }
  .spin { width:22px; height:22px; border-radius:50%; border:2.5px solid rgba(128,128,128,.25); border-top-color:#2563eb; animation:s .7s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </div>
    <div class="name">Context Menu Triage</div>
    <div class="spin"></div>
  </div>
</body>
</html>
