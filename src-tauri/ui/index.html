<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Context Menu Triage</title>
<style>
  :root { color-scheme: light dark; }
  html,body { height:100%; margin:0; }
  body {
    display:grid; place-items:center;
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    color:#5a686e; background:#e9edef;
  }
  @media (prefers-color-scheme: dark) { body { color:#9fabad; background:#0e1213; } }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .logo { width:76px; height:76px; }
  .logo svg { width:100%; height:100%; display:block; border-radius:19px; box-shadow:0 6px 18px rgba(37,99,235,.4); }
  .name { font-family:Bahnschrift,"Segoe UI",sans-serif; font-size:16px; letter-spacing:.3px; color:inherit; }
  .spin { width:22px; height:22px; border-radius:50%; border:2.5px solid rgba(128,128,128,.25); border-top-color:#2563eb; animation:s .7s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="ctg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6bed"/><stop offset="1" stop-color="#1b4fd0"/></linearGradient></defs><rect x="92" y="92" width="840" height="840" rx="210" fill="url(#ctg)"/><path d="M452 430 532 512 690 336" fill="none" stroke="#fff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/><path d="M492 600 648 756 M648 600 492 756" stroke="#fff" stroke-width="68" stroke-linecap="round" opacity=".92"/><polygon points="232,250 232,556 320,487 385,625 446,599 381,466 473,403" fill="#fff" stroke="#0c224e" stroke-width="26" stroke-linejoin="round" paint-order="stroke"/></svg>
    </div>
    <div class="name">Context Menu Triage</div>
    <div class="spin"></div>
  </div>
</body>
</html>
